  if ((V_接近 > 0)) {
  V_队vx[V_i] = ((V_队vx)[V_i] - ((V_接近 * V_nx) * V_弹性));
  V_队vy[V_i] = ((V_队vy)[V_i] - ((V_接近 * V_ny) * V_弹性));
  V_队vx[V_j] = ((V_队vx)[V_j] + ((V_接近 * V_nx) * V_弹性));
  V_队vy[V_j] = ((V_队vy)[V_j] + ((V_接近 * V_ny) * V_弹性));

  ctx1.beginPath();
